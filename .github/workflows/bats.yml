name: Bats

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bats-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ github.event_name == 'pull_request' && 'Bats (Linux)' || 'Nix cache (Linux)' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Nix store のキャッシュ
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'private_dot_config/nix-devshell/**', 'private_dot_local/**', 'local-skills/dogfood/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 0
      - name: devShell の準備と PR テスト
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/bats-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_CACHE_HOME="$HOME/.cache"
          unset CODEX_HOME CLAUDE_CONFIG_DIR
          mkdir -p "$HOME"
          test_command=(true)
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test_command=(bun run test)
          fi
          time nix develop ./private_dot_config/nix-devshell --profile "$RUNNER_TEMP/nix-user-profile" --command \
            nix develop . --profile "$RUNNER_TEMP/nix-repo-profile" --command \
              "${test_command[@]}"
