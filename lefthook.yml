glob_matcher: doublestar

test:
  jobs:
    - name: bats
      run: bun run test

pre-commit:
  parallel: true
  jobs:
    - name: pinact
      run: pinact run {staged_files}
      glob: ".github/**/*.{yaml,yml}"
      stage_fixed: true
    - name: shfmt
      run: shfmt -w {staged_files}
      glob: "**/*.sh"
      exclude:
        - ".agents/skills/**"
        - "private_dot_config/bash/bash-preexec.sh" # vendored third-party
      stage_fixed: true
    - name: shell-extensionless
      run: shfmt -w {staged_files} && shellcheck {staged_files}
      glob: "private_dot_local/bin/executable_*"
      file_types:
        - text/x-shellscript
        - text/x-sh
      stage_fixed: true
    - name: oxfmt
      run: bunx oxfmt --write {staged_files}
      glob:
        - "**/*.js"
        - "**/*.mjs"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
        - "**/*.md"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.toml"
      exclude:
        - "**/dist/**"
        - ".agents/skills/**"
        - ".claude/skills/**"
        - ".claude/worktrees/**"
        - ".worktrees/**"
        - "CHANGELOG.md"
        # apm 生成の lockfile。oxfmt で再整形すると apm install が runtime で
        # native 形式に書き戻し chezmoi と永続 drift するため除外する。
        - "apm.lock.yaml"
      stage_fixed: true
    - name: oxlint
      run: bunx oxlint --fix {staged_files}
      glob:
        - "**/*.js"
        - "**/*.mjs"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
      exclude:
        - "**/dist/**"
        - ".agents/skills/**"
        - ".claude/skills/**"
        - ".claude/worktrees/**"
        - ".worktrees/**"
      stage_fixed: true
    - name: ghalint
      run: ghalint run {staged_files}
      glob: ".github/workflows/*.{yaml,yml}"
      depends:
        - pinact
        - shfmt
        - oxfmt
        - oxlint
    - name: actionlint
      run: actionlint {staged_files}
      glob: ".github/workflows/*.{yaml,yml}"
      depends:
        - pinact
        - shfmt
        - oxfmt
        - oxlint
    - name: shellcheck
      run: shellcheck {staged_files}
      glob: "**/*.sh"
      exclude:
        - ".agents/skills/**"
        - "private_dot_config/bash/bash-preexec.sh" # vendored third-party
      depends:
        - pinact
        - shfmt
        - oxfmt
        - oxlint
    # 指示ファイルの文言・行一致を検査する Bats（数秒）。全 Bats を待たずに
    # 文言変更による契約テストの破損を commit 時に検出する。
    - name: instruction-contract
      run: >-
        bats tests/workflow-contract.bats tests/autonomous-peer-contract.bats && bats --filter 'Review Round contract' tests/gh-review-thread.bats
      glob:
        - "CLAUDE.md"
        - "AGENTS.md"
        - "GLOSSARY.md"
        - ".chezmoiignore"
        - "private_dot_claude/CLAUDE.md"
        - "private_dot_config/codex/AGENTS.md"
        - "private_dot_gemini/AGENTS.md"
        - "runtime/*.md"
        - "docs/architecture.md"
        - "docs/conventions.md"
        - "docs/adr/*.md"
        - "local-skills/ui-grill-with-docs/SKILL.md"
        - "local-skills/*-peer-refactor/**/*.md"
        - "tests/workflow-contract.bats"
        - "tests/autonomous-peer-contract.bats"
        - "tests/gh-review-thread.bats"
    - name: gitleaks
      run: gitleaks protect --staged -v
      exclude:
        - "node_modules/**"
      depends:
        - pinact
        - shfmt
        - oxfmt
        - oxlint
    - name: typecheck
      run: bunx tsc --noEmit
      # tsconfig.json の include (ルート *.ts のみ) と揃える。glob を広げる場合は
      # tsconfig 側も広げないと tsc が対象を読まず green で素通りする。
      glob:
        - "*.ts"
        - "*.tsx"
      exclude:
        - "node_modules/**"
      depends:
        - pinact
        - shfmt
        - oxfmt
        - oxlint

commit-msg:
  jobs:
    - run: cog verify --file {1}
