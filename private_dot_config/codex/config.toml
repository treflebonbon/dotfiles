model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
personality = "pragmatic"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "dotfiles-secure"

[apps.github]
default_tools_approval_mode = "approve"
destructive_enabled = false

[features]
hooks = true
goals = true

[mcp_servers.context7]
command = "bunx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.serena]
command = "uvx"
args = [
  "--from",
  "git+https://github.com/oraios/serena",
  "serena",
  "start-mcp-server",
  "--enable-web-dashboard",
  "false",
]

[permissions."dotfiles-secure"]
extends = ":workspace"

[permissions."dotfiles-secure".filesystem]
glob_scan_max_depth = 4
":workspace_roots" = { "." = "write", "**/.env*" = "deny", "**/*.pem" = "deny", "**/*.key" = "deny", "**/*.pfx" = "deny", "**/*.p12" = "deny", "**/credentials.json" = "deny", "**/credentials.*.json" = "deny", "**/secret.json" = "deny", "**/secrets.json" = "deny", "**/service-account*.json" = "deny" }
"~/.ssh/**" = "deny"
"~/.aws/**" = "deny"
"~/.config/gcloud/**" = "deny"

[permissions."dotfiles-secure".network]
enabled = true

[permissions."dotfiles-secure".network.domains]
"registry.npmjs.org" = "allow"
"**.github.com" = "allow"
"**.githubusercontent.com" = "allow"
"**.context7.com" = "allow"
"**.pypi.org" = "allow"
"files.pythonhosted.org" = "allow"
"**.python.org" = "allow"
"cache.nixos.org" = "allow"
"proxy.golang.org" = "allow"
"sum.golang.org" = "allow"
"**.crates.io" = "allow"
"static.rust-lang.org" = "allow"
"**.hex.pm" = "allow"
"cpan.metacpan.org" = "allow"

[plugins."github@openai-curated"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true
